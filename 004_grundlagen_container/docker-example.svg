;stroke-width:0.5;" width="15" x="164.128" y="410.5983"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="162.128" y="412.5983"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="162.128" y="416.5983"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.248" x="54.88" y="439.1334">getting-started</text></g><!--entity client--><g class="entity" data-entity="client" data-source-line="4" data-uid="ent0002" id="entity_client"><rect fill="#F1F1F1" height="46.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="93.833" x="61.08" y="44.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="134.913" y="49.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="132.913" y="51.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="132.913" y="55.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="53.833" x="76.08" y="78.0234">Browser</text></g><!--entity hport--><g class="entity" data-entity="hport" data-source-line="6" data-uid="ent0003" id="entity_hport"><ellipse cx="108" cy="179.9783" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="88.5391" x="63.7305" y="210.5134">127.0.0.1:80</text></g><g class="entity" data-entity="GMN10" data-source-line="19" data-uid="ent0011" id="entity_GMN10"><path d="M246.41,274.3583 L246.41,345.6005 L645.597,345.6005 L645.597,284.3583 L635.597,274.3583 L246.41,274.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M635.597,274.3583 L635.597,284.3583 L645.597,284.3583 L635.597,274.3583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="378.187" x="252.41" y="291.9266">- Container startet TCP-Dienst (Webserver) auf TCP-Port 80</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6904" x="252.41" y="307.2372">- dieser ist aber isoliert, von aussen nicht erreichbar</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="219.3496" x="252.41" y="322.5477">- beim Start konfigurieren wir eine</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="125.1377" x="475.8729" y="322.5477">Port-Weiterleitung</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="26.8506" x="260.6366" y="337.8583">vom</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="86.6519" x="291.6004" y="337.8583">Docker-Host</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.0161" x="378.2523" y="337.8583">, Port 80, zum</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="122.4971" x="472.3817" y="337.8583">Container-Port 80</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="594.8788" y="337.8583">.</text></g><!--link client to hport--><g class="link" data-entity-1="client" data-entity-2="hport" data-source-line="14" data-uid="lnk7" id="link_client_hport"><path d="M108,91.3083 C108,116.1283 108,148.6683 108,165.1083" fill="none" id="client-to-hport" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="108,171.1083,112,162.1083,108,166.1083,104,162.1083,108,171.1083" style="stroke:#181818;stroke-width:1;"/></g><!--link hport to cport--><g class="link" data-entity-1="hport" data-entity-2="cport" data-source-line="15" data-uid="lnk8" id="link